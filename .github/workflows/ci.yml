name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译检查
        run: python -m compileall app -q

      - name: 导入检查（不启动服务）
        run: python -c "from app.main import build; print('imports ok')"

      - name: 配置校验
        run: python -c "from app.config import Config; c = Config('config.json'); print('config ok', c.get('server', 'port'))"
